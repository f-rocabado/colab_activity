<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participación en el Estudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div id="main-content" class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center transition-all duration-300">
        <div class="mb-6">
            <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Actividad de colaboración</h1>
            <p class="text-slate-500 mt-2">Haz clic en el botón para comenzar. Serás asignado aleatoriamente a uno de los cuestionarios del estudio.</p>
        </div>

        <button onclick="handleParticipation()" id="participate-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-xl transition-colors duration-200 flex items-center justify-center gap-2 group">
            <span id="btn-text">Participar ahora</span>
            <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        </button>

        <p class="text-xs text-slate-400 mt-6">Al hacer clic, serás redirigido a un cuestionario para poder participar en el estudio.</p>
    </div>

    <!-- Capa de Carga -->
    <div id="loading-overlay" class="hidden fixed inset-0 bg-white/80 backdrop-blur-sm flex-col items-center justify-center transition-opacity duration-300 z-50">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div>
        <p class="text-slate-600 font-medium text-center px-4">Redirigiéndote al cuestionario...</p>
    </div>

    <script>
        const links = [
            "https://forms.gle/f3ZEBfSafrHcx8q96",
            "https://forms.gle/nxEgTE5NazzyM3EY7",
            "https://forms.gle/NDKoZ5L5wLX1ingMA",
            "https://forms.gle/KrdTjknANFp5Znc68"
        ];

        function handleParticipation() {
            const btn = document.getElementById('participate-btn');
            const overlay = document.getElementById('loading-overlay');
            const content = document.getElementById('main-content');

            // Mostrar estado de carga visual
            overlay.classList.remove('hidden');
            content.classList.add('opacity-50', 'pointer-events-none');
            btn.disabled = true;

            // Seleccionar un enlace al azar (25% de probabilidad para cada uno)
            const randomIndex = Math.floor(Math.random() * links.length);
            const selectedLink = links[randomIndex];

            // Redirigir
            setTimeout(() => {
                window.location.href = selectedLink;
            }, 600);
        }
    </script>
</body>
</html>
